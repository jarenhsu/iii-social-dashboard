<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- 不讓搜尋引擎收錄這個頁面 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>資策會社群數據 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface2: #f0f3f7;
    --border: #dfe4ea;
    --text: #1f2328;
    --text-muted: #656d76;
    --blue: #0969da;
    --blue-dim: #1f4b8e;
    --teal: #1a7f37;
    --purple: #a371f7;
    --orange: #cf222e;
    --yellow: #9a6700;
    --fb: #1877f2;
    --ig: #e1306c;
    --threads: #000000;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--body-font); }


  header {
    position: sticky; top: env(safe-area-inset-top, 0px);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 28px; height: 28px; background: var(--blue);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: white; letter-spacing: -0.5px;
  }
  .logo-text { font-weight: 600; font-size: 15px; color: var(--text); }
  .logo-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  .view-toggle {
    display: flex; gap: 2px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; padding: 3px;
  }
  .view-btn {
    padding: 5px 14px; border: none; border-radius: 5px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    background: transparent; color: var(--text-muted);
    transition: all 0.15s;
  }
  .view-btn.active { background: var(--surface); color: var(--text); }

  main { max-width: 1280px; margin: 0 auto; padding: 24px; }

  .last-updated { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; font-family: var(--num-font); }

  /* Platform tabs */
  .platform-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .platform-tab {
    padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); transition: all 0.15s;
  }
  .platform-tab.active-fb { background: rgba(24,119,242,0.15); border-color: var(--fb); color: var(--fb); }
  .platform-tab.active-ig { background: rgba(225,48,108,0.15); border-color: var(--ig); color: var(--ig); }
  .platform-tab.active-all { background: rgba(56,139,253,0.15); border-color: var(--blue); color: var(--blue); }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
  }
  .kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.3px; }
  .kpi-value { font-size: 26px; font-weight: 700; font-family: var(--num-font); line-height: 1; }
  .kpi-value.fb { color: var(--fb); }
  .kpi-value.ig { color: var(--ig); }
  .kpi-change { font-size: 11px; margin-top: 5px; color: var(--text-muted); }
  .kpi-change.up { color: var(--teal); }
  .kpi-change.down { color: var(--orange); }

  /* Charts */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .chart-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap.tall { height: 280px; }

  /* Loading */
  .loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 300px; flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text-muted); }

  .error-msg {
    background: rgba(247,129,102,0.1); border: 1px solid var(--orange);
    border-radius: 8px; padding: 16px; margin: 24px 0;
    font-size: 13px; color: var(--orange);
  }

  /* Empty state */
  .empty { text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px; }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    main { padding: 16px; }
  }
  .platform-section { margin-bottom: 40px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; padding-left: 10px; border-left: 4px solid var(--border); }
  .block-label { font-size: 12px; color: var(--text-muted); margin: 4px 0 8px; }
  .kpi-card.year { background: var(--surface2); }
  .section-title.fb { border-color: var(--fb); color: var(--fb); }
  .section-title.ig { border-color: var(--ig); color: var(--ig); }

  /* ===== P0 新增樣式 ===== */
  .kpi-card, .chart-card, .filter-bar, .table-wrap { box-shadow: 0 1px 2px rgba(31,35,40,0.06); }
  .error-msg { background: rgba(207,34,46,0.06); }
  .header-right { font-size: 12px; color: var(--text-muted); font-family: var(--num-font); text-align: right; }

  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 12px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.3px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
    transition: all 0.15s; font-family: inherit;
  }
  .chip:hover:not(:disabled) { color: var(--text); }
  .chip.active { background: rgba(56,139,253,0.15); border-color: var(--blue); color: var(--blue); }
  .chip:disabled { opacity: 0.35; cursor: not-allowed; }
  .platform-tabs { margin-bottom: 0; }
  select.month-select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: inherit;
  }
  .custom-range { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .custom-range.show { display: flex; }

  .period-caption { font-size: 12px; color: var(--text-muted); margin: 0 0 24px 2px; }
  .period-caption b { color: var(--text); font-weight: 600; }

  /* KPI 卡 */
  .kpi-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .kpi-card { display: flex; flex-direction: column; min-height: 132px; }
  .kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
  .kpi-label { margin-bottom: 0; font-size: 12px; }
  .kpi-value { font-size: 24px; cursor: default; }
  .kpi-change { margin-top: 8px; font-size: 12px; font-weight: 500; }
  .kpi-change .abs { color: var(--text-muted); font-weight: 400; margin-left: 4px; }
  .kpi-change.flat { color: var(--text-muted); }
  .spark-wrap { height: 32px; margin-top: auto; padding-top: 8px; }

  .info {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border);
    font-size: 10px; color: var(--text-muted); cursor: help; flex-shrink: 0;
  }
  .info:hover::after, .info:focus::after {
    content: attr(data-tip); position: absolute; right: 0; top: 22px; z-index: 50;
    width: 220px; padding: 8px 10px; border-radius: 6px; font-size: 11px; line-height: 1.5;
    background: #1f2328; border: 1px solid #1f2328; color: #ffffff; white-space: normal;
  }

  /* 趨勢圖 */
  .trend-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .trend-head .chart-sub { margin-bottom: 0; }

  /* 尚缺資料提示 */
  .todo-note {
    font-size: 11px; color: var(--text-muted); border: 1px dashed var(--border);
    border-radius: 8px; padding: 10px 12px; margin-top: 4px; line-height: 1.6;
  }
  .todo-note b { color: var(--yellow); font-weight: 600; }

  /* Top Posts */
  .posts-section { margin-bottom: 40px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  table.posts { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
  table.posts th, table.posts td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  table.posts th { font-size: 11px; color: var(--text-muted); font-weight: 500; background: var(--surface2); }
  table.posts td.num, table.posts th.num { text-align: right; font-family: var(--num-font); }
  table.posts tr:last-child td { border-bottom: none; }
  table.posts a { color: var(--blue); text-decoration: none; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .tag.fb { background: rgba(24,119,242,0.15); color: var(--fb); }
  .tag.ig { background: rgba(225,48,108,0.15); color: var(--ig); }
  .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-head .section-title { margin-bottom: 0; }
  .section-title.all { border-color: var(--blue); color: var(--text); }
  .post-cell { display: flex; align-items: center; gap: 12px; }
  .post-cell a, .post-cell span { line-height: 1.5; }
  .thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; display: block; border: 1px solid var(--border); background: var(--surface2); }
  .thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .thumb.ph.fb { color: var(--fb); background: rgba(24,119,242,0.08); }
  .thumb.ph.ig { color: var(--ig); background: rgba(225,48,108,0.08); }

  details.year-block { margin-top: 16px; }
  details.year-block summary { font-size: 12px; color: var(--text-muted); cursor: pointer; margin-bottom: 10px; }

  @media (max-width: 768px) {
    .filter-bar { gap: 12px; }
    header { padding: 0 16px; }
    .header-right { display: none; }
  }


  /* ===== 視覺更新：字級放大、風格活潑 ===== */
  :root {
    --body-font: 'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --num-font: 'Outfit', 'Noto Sans TC', -apple-system, sans-serif;
    --bg: #eef3fb;
    --text: #1b2433;
    --text-muted: #5b6577;
    --border: #dbe3ef;
    --ig-grad: linear-gradient(120deg, #7b3fe4 0%, #e1306c 55%, #ff9a3c 100%);
    --fb-grad: linear-gradient(120deg, #0b5ed7 0%, #1877f2 55%, #4aa8ff 100%);
  }
  html { font-size: 16px; }
  body { line-height: 1.6; -webkit-font-smoothing: antialiased;
    background: radial-gradient(1200px 500px at 85% -10%, rgba(225,48,108,0.08), transparent 60%),
                radial-gradient(1000px 500px at -10% 0%, rgba(24,119,242,0.10), transparent 60%), var(--bg); }

  header { height: 72px; padding: 0 32px; background: rgba(255,255,255,0.85); }
  .logo-mark { width: 40px; height: 40px; border-radius: 12px; font-size: 15px; font-family: var(--num-font); font-weight: 800;
    background: conic-gradient(from 200deg, #1877f2, #7b3fe4, #e1306c, #ff9a3c, #1877f2); }
  .logo-text { font-size: 19px; font-weight: 900; letter-spacing: 0.5px; }
  .logo-sub { font-size: 14px; }
  .header-right { font-size: 14px; font-family: var(--body-font); }

  main { max-width: 1320px; padding: 32px; }

  .filter-bar { padding: 20px 24px; border-radius: 18px; gap: 20px 32px; }
  .filter-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .chip { font-size: 15px; padding: 7px 16px; border-radius: 999px; }
  .chip.active { background: #1b2433; border-color: #1b2433; color: #fff; }
  .platform-tab { font-size: 15px; padding: 8px 20px; border-radius: 999px; font-weight: 700; }
  .platform-tab.active-all { background: #1b2433; border-color: #1b2433; color: #fff; }
  .platform-tab.active-fb { background: var(--fb-grad); border-color: transparent; color: #fff; }
  .platform-tab.active-ig { background: var(--ig-grad); border-color: transparent; color: #fff; }
  .view-toggle { border-radius: 999px; padding: 4px; }
  .view-toggle .chip { border: none; background: transparent; padding: 6px 18px; }
  .view-toggle .chip.active { background: #1b2433; color: #fff; }
  select.month-select { font-size: 15px; padding: 6px 10px; border-radius: 10px; }
  .custom-range { font-size: 15px; margin-top: 4px; }
  .period-caption { font-size: 15px; margin: 4px 0 32px 4px; }

  /* 平台大標：這頁唯一的大膽元素 */
  .platform-section { margin-bottom: 56px; }
  .section-title { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900;
    padding: 10px 26px; border: none; border-radius: 999px; color: #fff; margin-bottom: 20px; letter-spacing: 0.5px; }
  .section-title.fb { background: var(--fb-grad); color: #fff; box-shadow: 0 8px 20px -8px rgba(24,119,242,0.55); }
  .section-title.ig { background: var(--ig-grad); color: #fff; box-shadow: 0 8px 20px -8px rgba(225,48,108,0.55); }
  .section-title.all { background: #1b2433; color: #fff; }

  /* KPI */
  .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card, .chart-card { min-width: 0; }
  .platform-tab { white-space: nowrap; }
  .kpi-card { border-radius: 18px; padding: 20px 22px; min-height: 168px; border: 1px solid var(--border); }
  .kpi-label { font-size: 16px; font-weight: 700; color: var(--text); }
  .kpi-value { font-size: 36px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
  .kpi-change { font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  .kpi-change .abs { font-size: 14px; margin-left: 0; }
  .delta { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-family: var(--num-font); }
  .delta.up { background: rgba(26,127,55,0.12); color: #1a7f37; }
  .delta.down { background: rgba(207,34,46,0.10); color: #cf222e; }
  .delta.flat { background: var(--surface2); color: var(--text-muted); }
  .spark-wrap { height: 40px; }
  .info { width: 20px; height: 20px; font-size: 12px; font-weight: 700; }
  .info:hover::after, .info:focus::after { font-size: 14px; width: 260px; padding: 10px 12px; border-radius: 10px; }

  /* 年度 */
  details.year-block summary { font-size: 16px; font-weight: 700; color: var(--text); }
  .kpi-card.year { min-height: auto; background: rgba(255,255,255,0.6); border-style: dashed; }
  .kpi-card.year .kpi-value { font-size: 30px; }

  /* 圖表 */
  .chart-card { border-radius: 18px; padding: 24px 26px; }
  .chart-title { font-size: 19px; font-weight: 900; }
  .chart-sub { font-size: 14px; }
  .chart-wrap.tall { height: 340px; }
  .trend-head .chip { font-size: 14px; }

  .todo-note { font-size: 14px; border-radius: 14px; padding: 14px 16px; background: rgba(255,255,255,0.6); }

  /* Top Posts */
  .section-head { margin-bottom: 20px; }
  .table-wrap { border-radius: 18px; }
  table.posts { font-size: 16px; }
  table.posts th { font-size: 14px; font-weight: 700; padding: 14px 18px; white-space: nowrap; }
  table.posts td:nth-child(3), table.posts td:nth-child(4) { white-space: nowrap; }
  table.posts td { padding: 14px 18px; }
  table.posts td:first-child { font-family: var(--num-font); font-weight: 800; font-size: 20px; color: var(--text-muted); width: 56px; }
  table.posts tr:nth-child(1) td:first-child { color: #e3a008; }
  table.posts tr:nth-child(2) td:first-child { color: #8a97a8; }
  table.posts tr:nth-child(3) td:first-child { color: #c2703d; }
  table.posts tbody tr:hover { background: #f6f9ff; }
  table.posts a { font-weight: 500; }
  .thumb { width: 76px; height: 76px; border-radius: 14px; }
  .thumb.ph { font-size: 14px; }
  .tag { font-size: 13px; padding: 3px 12px; }
  .tag.fb { background: var(--fb-grad); color: #fff; }
  .tag.ig { background: var(--ig-grad); color: #fff; }

  .empty { font-size: 16px; }
  .error-msg { font-size: 15px; border-radius: 14px; }
  .loading-text { font-size: 15px; }

  @media (max-width: 768px) {
    html { font-size: 15px; }
    header { padding: 0 16px; }
    main { padding: 18px; }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kpi-value { font-size: 28px; }
    .section-title { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== 手機版 ===== */
  @media (max-width: 640px) {
    html { font-size: 15px; }
    header { height: 60px; padding: 0 16px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; }
    .logo-text { font-size: 17px; }
    .logo-sub { font-size: 12px; }
    main { padding: 14px 14px 40px; }

    /* 篩選列：每組一行，左右滑動 */
    .filter-bar { padding: 14px 0 14px 14px; gap: 14px; border-radius: 16px; flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
    .filter-group { min-width: 0; }
    .filter-group .chip-row, .platform-tabs, .view-toggle {
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-right: 14px;
    }
    .filter-group .chip-row::-webkit-scrollbar, .platform-tabs::-webkit-scrollbar { display: none; }
    .view-toggle { align-self: flex-start; padding-right: 4px; }
    .chip { font-size: 14px; padding: 7px 14px; white-space: nowrap; flex-shrink: 0; }
    .platform-tab { font-size: 14px; padding: 7px 16px; flex-shrink: 0; }
    .custom-range { padding-right: 14px; }
    .chip[data-period]:disabled { display: none; }
    .period-caption { font-size: 13px; margin: 2px 2px 22px; }

    /* 平台標題 */
    .platform-section { margin-bottom: 40px; }
    .section-title { font-size: 19px; padding: 8px 20px; margin-bottom: 14px; }

    /* KPI：兩欄 */
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi-card { padding: 14px; min-height: 0; border-radius: 14px; }
    .kpi-label { font-size: 14px; }
    .kpi-value { font-size: 26px; }
    .kpi-change { font-size: 12px; gap: 4px; margin-top: 8px; }
    .kpi-change .abs { font-size: 12px; }
    .delta { padding: 1px 8px; }
    .spark-wrap { height: 30px; padding-top: 6px; }
    .kpi-card.year .kpi-value { font-size: 22px; }

    /* 指標說明：點 i 後從畫面底部浮出 */
    .info { width: 22px; height: 22px; }
    .info:hover::after, .info:focus::after {
      position: fixed; left: 14px; right: 14px; bottom: 16px; top: auto; width: auto;
      font-size: 14px; padding: 14px 16px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    /* 趨勢圖 */
    .chart-card { padding: 16px 14px; border-radius: 14px; }
    .chart-title { font-size: 17px; }
    .chart-sub { font-size: 12px; }
    .trend-head { flex-direction: column; flex-wrap: nowrap; gap: 10px; margin-bottom: 8px; }
    .trend-head > div { min-width: 0; }
    .trend-head .chip-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -14px; padding-right: 14px; }

<script>
// ============================================================
// 資策會社群數據 Dashboard（P0 優化版）
// 資料來源：Google Sheets（公開 CSV）
//   - 月資料：第一個工作表（gid=0），每月一列
//   - 每日資料：工作表「每日」（TODO：尚未建立，建立後自動啟用日/週粒度、近7天/近30天）
//   - 貼文資料：工作表「貼文」（TODO：尚未建立，建立後自動啟用 Top Posts）
// ============================================================
const SHEET_ID = '1yC3TtIXVg377qBTsZjA5Yad5HxVRBwX6BE3S4nel9A0';
// YouTube（另一份已發布到網路的試算表）
const YT_MONTHLY_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtWeKJOOWHM44KvgkQl_dBRbG6pFl8RzC4BWKlOF90rCTcbOsOKBgzw_744YljOTr-IN5ZHeNgI7zS/pub?gid=999104727&single=true&output=csv';
const YT_VIDEOS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtWeKJOOWHM44KvgkQl_dBRbG6pFl8RzC4BWKlOF90rCTcbOsOKBgzw_744YljOTr-IN5ZHeNgI7zS/pub?gid=595465853&single=true&output=csv';
const csvUrl = q => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&${q}`;

// ---------- 指標定義 ----------
// type: flow = 期間內可加總；snapshot = 取期末值，不可加總；ratio = 由分子/分母計算
const PLATFORMS = [
  { id: 'fb', name: 'Facebook', color: '#1877f2', fill: 'rgba(24,119,242,0.10)', prevColor: 'rgba(101,109,118,0.7)',
    metrics: [
      { id: 'fb_fans', label: '粉絲總數', type: 'snapshot', def: '粉絲專頁總粉絲數（fan_count），取期末快照，不可跨月加總。' },
      { id: 'fb_reach', label: '觸及人數', type: 'flow', def: 'page_total_media_view_unique 每日值加總。同一人跨日會重複計算，不等於不重複總人數。' },
      { id: 'fb_engage', label: '貼文互動', type: 'flow', def: 'page_post_engagements 加總：貼文的按讚、留言、分享、點擊等互動次數。' },
      { id: 'fb_er', label: '互動率', type: 'ratio', num: 'fb_engage', den: 'fb_reach', def: '貼文互動 ÷ 觸及人數。比較時以「百分點」呈現差異。' },

// 試算表欄名 → 指標 id
function detectColumns(headers) {
  const map = {};
  headers.forEach(h => {
    const l = h.toLowerCase();
    if (l.includes('fb')) {
      if (l.includes('粉絲') || l.includes('fans')) map.fb_fans = h;
      else if (l.includes('觸及') || l.includes('reach')) map.fb_reach = h;
      else if (l.includes('互動') || l.includes('engage')) map.fb_engage = h;
      else if (l.includes('頁面') || l.includes('page_view')) map.fb_pageviews = h;
      else if (l.includes('影片') || l.includes('video')) map.fb_views = h;
      else if (l.includes('追蹤') || l.includes('follow')) map.fb_follows = h;
    }
    if (l.startsWith('th')) {
      if (l.includes('粉絲') || l.includes('follower')) map.th_followers = h;
      else if (l.includes('瀏覽') || l.includes('view')) map.th_views = h;
      else if (l.includes('互動') || l.includes('engage')) map.th_engage = h;
      else if (l.includes('讚') || l.includes('like')) map.th_likes = h;
      else if (l.includes('回覆') || l.includes('repl')) map.th_replies = h;
      else if (l.includes('轉發') || l.includes('引用') || l.includes('repost')) map.th_reposts = h;
      return;
    }
    if (l.includes('ig')) {
      if (l.includes('追蹤') || l.includes('follower')) map.ig_followers = h;
      else if (l.includes('觸及') || l.includes('reach')) map.ig_reach = h;
      else if (l.includes('瀏覽') || l.includes('view')) map.ig_views = h;
      else if (l.includes('互動') || l.includes('interact')) map.ig_engage = h;
    }
  });
  return map;
}

// ---------- 工具 ----------
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  if (rows.length < 2) return { headers: [], rows: [] };
  const headers = rows[0].map(h => h.trim());
  const out = rows.slice(1).filter(r => r.some(v => v.trim() !== '')).map(r => {
    const o = {}; headers.forEach((h, i) => { o[h] = (r[i] ?? '').trim(); }); return o;
  });
  return { headers, rows: out };
}
const toNum = v => {
  if (v === undefined || v === null) return null;
  const s = String(v).replace(/,/g, '').trim();
  if (s === '') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
};
function parseMonth(s) {
  const m = String(s).match(/(\d{4})[-\/.](\d{1,2})/);
  return m ? new Date(+m[1], +m[2] - 1, 1) : null;
}
function parseDay(s) {
  const m = String(s).match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
const pad = n => String(n).padStart(2, '0');
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monthEnd = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
const inRange = (d, r) => d >= r.start && d <= r.end;

function fmtNum(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(1) + '億';
  if (a >= 1e4) return (n / 1e4).toFixed(1) + '萬';
  return Math.round(n).toLocaleString('zh-TW');
}
const fmtFull = n => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
const fmtPct = r => (r === null || r === undefined || isNaN(r)) ? '—' : (r * 100).toFixed(1) + '%';
const fmtMin = v => (v === null || v === undefined || isNaN(v)) ? '—' : v.toFixed(1) + ' 分';
const fmtVal = (m, v) => m.unit === 'min' ? fmtMin(v) : m.type === 'ratio' ? fmtPct(v) : fmtNum(v);
const fmtValFull = (m, v) => m.unit === 'min' ? (v === null ? '—' : v.toFixed(2) + ' 分鐘') : m.type === 'ratio' ? (v === null ? '—' : (v * 100).toFixed(2) + '%') : fmtFull(v);

// ---------- 讀取資料 ----------
async function fetchSheet(q) {
  const res = await fetch(csvUrl(q));
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text());
}
function normalize(parsed, kind) {
  const { headers, rows } = parsed;
  if (!headers.length) return [];
  const map = detectColumns(headers);
  const first = headers[0];
  return rows.map(r => {
    const date = kind === 'day' ? parseDay(r[first]) : parseMonth(r[first]);
    if (!date) return null;
    const vals = {};
    Object.keys(map).forEach(id => { vals[id] = toNum(r[map[id]]); });
    return { date, key: kind === 'day' ? dayKey(date) : monthKey(date), vals };
  }).filter(Boolean).sort((a, b) => a.date - b.date);
}

// 貼文ID, 平台(FB/IG), 日期, 標題, 觸及, 互動, 留言, 分享, 網址
function normalizePosts(parsed) {
  const { headers, rows } = parsed;
  const find = (...keys) => headers.find(h => keys.some(k => h.toLowerCase().includes(k)));
  const cPlat = find('平台', 'platform'), cDate = find('日期', 'date'), cTitle = find('標題', '內容', 'title', 'caption');
  const cReach = find('觸及', 'reach'), cEng = find('互動', 'engage', 'interaction');
  const cCom = find('留言', 'comment'), cShare = find('分享', 'share'), cUrl = find('網址', 'url', 'link'), cId = find('貼文id', 'post_id');
  const cImg = find('圖片', 'image', 'picture', 'thumbnail');
  if (!cPlat || !cDate || !cReach || !cEng) return [];
  return rows.map(r => {
    const date = parseDay(r[cDate]); if (!date) return null;
    const p = String(r[cPlat]).toLowerCase();
    const platform = p.includes('ig') || p.includes('insta') ? 'ig' : p.includes('fb') || p.includes('face') ? 'fb' : p.includes('yt') || p.includes('youtube') ? 'yt' : (p === 'th' || p.includes('threads')) ? 'th' : null;
    if (!platform) return null;
    const reach = toNum(r[cReach]), engage = toNum(r[cEng]);
    return {
      id: cId ? r[cId] : '', platform, date, title: cTitle ? r[cTitle] : '(無標題)',
      reach, engage, comments: cCom ? toNum(r[cCom]) : null, shares: cShare ? toNum(r[cShare]) : null,
      url: cUrl ? r[cUrl] : '', img: cImg ? r[cImg] : '', er: reach ? engage / reach : null,
    };
  }).filter(Boolean);
}

async function fetchUrl(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text());
}
// YouTube：月資料併進 DATA.monthly，影片清單另存並換算每月上片數
function mergeYouTube(monthlyParsed, videosParsed) {
  const byKey = new Map(DATA.monthly.map(r => [r.key, r]));
  // 不讓 YouTube 比 FB／IG 多出來的月份變成「最新月份」，避免 FB／IG 本期變成空的
  const maxDate = DATA.monthly.length ? DATA.monthly[DATA.monthly.length - 1].date : null;
  const ensure = d => {
    const k = monthKey(d);
    if (maxDate && new Date(d.getFullYear(), d.getMonth(), 1) > maxDate) return null;
    if (!byKey.has(k)) { const r = { date: new Date(d.getFullYear(), d.getMonth(), 1), key: k, vals: {} }; byKey.set(k, r); DATA.monthly.push(r); }
    return byKey.get(k);
  };
  if (monthlyParsed?.headers?.length) {
    const h = monthlyParsed.headers;
    const col = (...keys) => h.find(x => keys.some(k => x.includes(k)));
    const cV = col('觀看次數', 'views'), cM = col('觀看分鐘', '分鐘', 'minutes'), cS = col('訂閱', 'subscriber');
    monthlyParsed.rows.forEach(r => {
      const d = parseMonth(r[h[0]]); if (!d) return;
      const row = ensure(d); if (!row) return;
      if (cV) row.vals.yt_views = toNum(r[cV]);
      if (cM) row.vals.yt_minutes = toNum(r[cM]);
      if (cS) row.vals.yt_subs = toNum(r[cS]);
    });
  }
  const ytPosts = DATA.posts.filter(x => x.platform === 'yt');
  if (ytPosts.length) {
    DATA.videos = ytPosts.map(x => ({ date: x.date, title: x.title, url: x.url, id: (x.id || '').replace(/^YT_/, ''), views: x.reach }))
      .sort((a, b) => b.date - a.date);
    const first = DATA.videos[DATA.videos.length - 1].date;
    const firstM = new Date(first.getFullYear(), first.getMonth(), 1);
    // 貼文表只收今年影片，所以從今年 1 月起算上片數
    const yStart = new Date(DATA.videos[0].date.getFullYear(), 0, 1);
    DATA.monthly.forEach(r => { if (r.date >= (yStart < firstM ? yStart : firstM)) r.vals.yt_videos = 0; });
    DATA.videos.forEach(v => { const row = ensure(v.date); if (row) row.vals.yt_videos = (row.vals.yt_videos || 0) + 1; });
  } else if (videosParsed?.headers?.length) {
    const h = videosParsed.headers;
    const col = (...keys) => h.find(x => keys.some(k => x.includes(k)));
    const cT = col('發布', 'publish', '時間'), cTitle = col('標題', 'title'), cUrl = col('連結', 'url', 'link'), cId = col('影片ID', 'id');
    DATA.videos = videosParsed.rows.map(r => {
      const t = new Date(r[cT]); if (isNaN(t)) return null;
      const tw = new Date(t.getTime() + 8 * 3600 * 1000); // 轉台灣時間
      const date = new Date(tw.getUTCFullYear(), tw.getUTCMonth(), tw.getUTCDate());
      return { date, title: r[cTitle] || '(無標題)', url: r[cUrl] || '', id: r[cId] || '' };
    }).filter(Boolean).sort((a, b) => b.date - a.date);
    if (DATA.videos.length) {
      // 只從清單最早那個月開始算上片數，更早的月份不知道就留空
      const first = DATA.videos[DATA.videos.length - 1].date;
      const firstM = new Date(first.getFullYear(), first.getMonth(), 1);
      DATA.monthly.forEach(r => { if (r.date >= firstM) r.vals.yt_videos = 0; });
      DATA.videos.forEach(v => { const row = ensure(v.date); if (row) row.vals.yt_videos = (row.vals.yt_videos || 0) + 1; });
    }
  }
  DATA.monthly.sort((a, b) => a.date - b.date);
}

// ---------- 期間計算 ----------
const PERIOD_LABEL = {
  this_month: '本月', last_month: '上月', last_3m: '近 3 個月', last_6m: '近 6 個月',
  ytd: '今年', last_7d: '近 7 天', last_30d: '近 30 天', custom: '自訂',
};
function resolvePeriod() {
  const hasDaily = DATA.daily.length > 0;
  const latestM = DATA.monthly[DATA.monthly.length - 1].date;
  const mRange = (startM, n) => ({ start: startM, end: monthEnd(addMonths(startM, n - 1)), n });
  const mLabel = r => r.n === 1 ? monthKey(r.start) : `${monthKey(r.start)} ~ ${monthKey(r.end)}`;
  let cur, prev, unit = 'month';
  switch (state.period) {
    case 'this_month': cur = mRange(latestM, 1); break;
    case 'last_month': cur = mRange(addMonths(latestM, -1), 1); break;
    case 'last_3m': cur = mRange(addMonths(latestM, -2), 3); break;
    case 'last_6m': cur = mRange(addMonths(latestM, -5), 6); break;
    case 'ytd': { const s = new Date(latestM.getFullYear(), 0, 1); cur = mRange(s, latestM.getMonth() + 1); break; }
    case 'custom': {
      let a = parseMonth(state.customFrom), b = parseMonth(state.customTo);
      if (a > b) [a, b] = [b, a];
      cur = mRange(a, (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() + 1); break;
    }
    case 'last_7d': case 'last_30d': {
      if (!hasDaily) { state.period = 'last_3m'; return resolvePeriod(); }
      unit = 'day';
      const n = state.period === 'last_7d' ? 7 : 30;
      const latestD = DATA.daily[DATA.daily.length - 1].date;
      cur = { start: addDays(latestD, -(n - 1)), end: latestD, n };
      prev = { start: addDays(cur.start, -n), end: addDays(cur.start, -1), n };
      const dl = r => `${dayKey(r.start)} ~ ${dayKey(r.end)}`;
      return { cur: { ...cur, label: dl(cur) }, prev: { ...prev, label: dl(prev) }, unit };
    }
  }
  // 今年：跟去年同期比（例如 2026-01~09 對比 2025-01~09）
  prev = state.period === 'ytd' ? mRange(addMonths(cur.start, -12), cur.n) : mRange(addMonths(cur.start, -cur.n), cur.n);
  return { cur: { ...cur, label: mLabel(cur) }, prev: { ...prev, label: mLabel(prev) }, unit };
}

// ---------- 彙總 ----------
function aggregate(rows, m) {
  if (m.type === 'ratio') {
    const n = aggregate(rows, METRIC[m.num]), d = aggregate(rows, METRIC[m.den]);
    return (n === null || !d) ? null : n / d;
  }
  const vals = rows.map(r => r.vals[m.id]).filter(v => v !== null && v !== undefined);
  if (!vals.length) return null;
  return m.type === 'snapshot' ? vals[vals.length - 1] : vals.reduce((a, b) => a + b, 0);
}
// 期間總值：月期間用月資料，日期間用每日資料
function periodRows(range, unit) {
  const src = unit === 'day' ? DATA.daily : DATA.monthly;
  return src.filter(r => inRange(r.date, range));
}
// 欄位是否有任何資料（決定要不要顯示）
function hasMetric(m) {
  if (m.type === 'ratio') return hasMetric(METRIC[m.num]) && hasMetric(METRIC[m.den]);
  return DATA.monthly.some(r => r.vals[m.id] !== null && r.vals[m.id] !== undefined)
      || DATA.daily.some(r => r.vals[m.id] !== null && r.vals[m.id] !== undefined);
}
// 比較：處理 null、0、無前期
function compare(m, cur, prev) {
  if (cur === null || prev === null) return { kind: 'none' };
  if (m.type === 'ratio' && m.unit !== 'min') {
    const pp = (cur - prev) * 100;
    if (Math.abs(pp) < 0.005) return { kind: 'flat', text: '持平' };
    const rel = prev ? (cur - prev) / Math.abs(prev) : null;
    return { kind: pp > 0 ? 'up' : 'down', text: `${pp > 0 ? '+' : ''}${pp.toFixed(1)} 個百分點`, abs: rel !== null ? `(${rel > 0 ? '+' : ''}${(rel * 100).toFixed(1)}%)` : '' };
  }
  const diff = cur - prev;
  if (diff === 0) return { kind: 'flat', text: '持平' };
  if (prev === 0) return { kind: diff > 0 ? 'up' : 'down', text: '前期為 0', abs: `${diff > 0 ? '+' : ''}${fmtNum(diff)}` };
  const pct = diff / Math.abs(prev) * 100;
  return { kind: diff > 0 ? 'up' : 'down', text: `${pct > 0 ? '+' : ''}${pct.toFixed(1)}%`, abs: `${diff > 0 ? '+' : '−'}${fmtNum(Math.abs(diff))}` };
}
// 依粒度切 bucket
function buckets(range, unit) {
  const useMonthly = state.gran === 'month' && unit === 'month';
  if (useMonthly) {
    const out = [];
    for (let d = new Date(range.start); d <= range.end; d = addMonths(d, 1)) {
      const k = monthKey(d);
      out.push({ label: k, rows: DATA.monthly.filter(r => r.key === k) });
    }
    return out;
  }
  const rows = DATA.daily.filter(r => inRange(r.date, range));
  const groups = new Map();
  rows.forEach(r => {
    let k;
    if (state.gran === 'day') k = dayKey(r.date);
    else if (state.gran === 'week') { const mon = addDays(r.date, -((r.date.getDay() + 6) % 7)); k = `${dayKey(mon)} 週`; }
    else k = monthKey(r.date);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });
  return [...groups.entries()].map(([label, rows]) => ({ label, rows }));
}

// ---------- 元件：KpiCard ----------
function KpiCard(p, m, ctx, sparkId) {
  const cur = aggregate(periodRows(ctx.cur, ctx.unit), m);
  const prev = aggregate(periodRows(ctx.prev, ctx.unit), m);
  const c = compare(m, cur, prev);
  const arrow = { up: '↑', down: '↓', flat: '→' }[c.kind] || '';
  const change = c.kind === 'none'
    ? '<div class="kpi-change flat">— 無前期資料</div>'
    : `<div class="kpi-change"><span class="delta ${c.kind}">${arrow} ${c.text}</span>${c.abs ? `<span class="abs">${c.abs}</span>` : ''}<span class="abs">較上期</span></div>`;
  const note = m.type === 'snapshot' ? '（期末）' : '';
  return `<div class="kpi-card">
    <div class="kpi-head"><span class="kpi-label">${m.label}${note}</span><span class="info" tabindex="0" data-tip="${m.def}">i</span></div>
    <div class="kpi-value ${p.id}" title="${fmtValFull(m, cur)}">${fmtVal(m, cur)}</div>
    ${change}
    <div class="spark-wrap"><canvas id="${sparkId}"></canvas></div>
  </div>`;
}
// sparkline：期間結束前最近 8 個月
function sparkSeries(m, ctx) {
  const endKey = monthKey(ctx.cur.end);
  const idx = DATA.monthly.findIndex(r => r.key === endKey);
  const upto = idx >= 0 ? DATA.monthly.slice(0, idx + 1) : DATA.monthly.filter(r => r.date <= ctx.cur.end);
  return upto.slice(-8).map(r => ({ label: r.key, v: aggregate([r], m) }));
}

// ---------- 元件：TrendChart ----------
function TrendChart(p, metrics, ctx) {
  const sel = metrics.find(m => m.id === state.trendMetric[p.id]) || metrics.find(m => m.type !== 'snapshot') || metrics[0];
  state.trendMetric[p.id] = sel.id;
  const chips = metrics.filter(m => m.type !== 'snapshot').map(m =>
    `<button class="chip ${m.id === sel.id ? 'active' : ''}" onclick="setTrendMetric('${p.id}','${m.id}')">${m.label}</button>`).join('');
  const granLabel = { day: '每日', week: '每週', month: '每月' }[state.gran];
  return {
    html: `<div class="chart-card full">
      <div class="trend-head">
        <div><div class="chart-title">${sel.label}趨勢｜本期 vs 上期</div>
        <div class="chart-sub">${granLabel}｜本期 ${ctx.cur.label}　上期 ${ctx.prev.label}</div></div>
        <div class="chip-row">${chips}</div>
      </div>
      <div class="chart-wrap tall"><canvas id="trend-${p.id}"></canvas></div>
    </div>`,
    draw: () => {
      const cb = buckets(ctx.cur, ctx.unit), pb = buckets(ctx.prev, ctx.unit);
      const n = Math.max(cb.length, pb.length);
      const curVals = Array.from({ length: n }, (_, i) => cb[i] ? aggregate(cb[i].rows, sel) : null);
      const prevVals = Array.from({ length: n }, (_, i) => pb[i] ? aggregate(pb[i].rows, sel) : null);
      const toY = v => v === null ? null : (sel.unit === 'min' ? +v.toFixed(2) : sel.type === 'ratio' ? +(v * 100).toFixed(2) : v);
      const single = n <= 1;
      const labels = Array.from({ length: n }, (_, i) => cb[i]?.label || `第 ${i + 1} 期`);
      charts['trend-' + p.id] = new Chart(document.getElementById('trend-' + p.id), {
        type: single ? 'bar' : 'line',
        data: {
          labels,
          datasets: [
            { label: `本期（${ctx.cur.label}）`, data: curVals.map(toY), borderColor: p.color, backgroundColor: single ? p.color : p.fill,
              fill: !single, tension: 0.35, pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: '#fff', pointBorderWidth: 2.5, spanGaps: true, borderWidth: 3, borderRadius: 8 },
            { label: `上期（${ctx.prev.label}）`, data: prevVals.map(toY), borderColor: p.prevColor, backgroundColor: single ? 'rgba(101,109,118,0.35)' : 'transparent',
              borderDash: [6, 5], tension: 0.35, pointRadius: 3, spanGaps: true, borderWidth: 2, borderRadius: 8 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#55555d', font: { size: isMobile() ? 12 : 14, family: "'Noto Sans TC', sans-serif" }, boxWidth: isMobile() ? 14 : 18, padding: isMobile() ? 10 : 16 } },
            tooltip: {
              padding: 12, titleFont: { size: 14 }, bodyFont: { size: 14 }, footerFont: { size: 13 },
              callbacks: {
                title: items => { const i = items[0].dataIndex; return `本期 ${cb[i]?.label || '—'}　vs　上期 ${pb[i]?.label || '—'}`; },
                label: c => `${c.datasetIndex === 0 ? '本期' : '上期'}：${fmtValFull(sel, c.datasetIndex === 0 ? curVals[c.dataIndex] : prevVals[c.dataIndex])}`,
                afterBody: items => {
                  const i = items[0].dataIndex, r = compare(sel, curVals[i] ?? null, prevVals[i] ?? null);
                  return r.kind === 'none' ? '差異：無比較資料' : `差異：${r.text} ${r.abs || ''}`;
                },
              },
            },
          },
          scales: {
            x: { ticks: { color: '#55555d', maxRotation: 0, autoSkipPadding: 12, font: { size: isMobile() ? 11 : 13, family: "'Outfit', 'Noto Sans TC', sans-serif" } }, grid: { color: 'rgba(0,0,0,0.07)' } },
            y: { beginAtZero: true, ticks: { color: '#55555d', maxTicksLimit: isMobile() ? 5 : 8, font: { size: isMobile() ? 11 : 13, family: "'Outfit', 'Noto Sans TC', sans-serif" }, callback: v => sel.unit === 'min' ? v + ' 分' : sel.type === 'ratio' ? v + '%' : fmtNum(v) }, grid: { color: 'rgba(0,0,0,0.07)' } },
          },
        },
      });
    },
  };
}

// ---------- 元件：YearSummary（全年度累計，沿用前版需求） ----------
function YearSummary(p, metrics) {
  const latest = DATA.monthly[DATA.monthly.length - 1].date;
  const year = latest.getFullYear();
  const rows = DATA.monthly.filter(r => r.date.getFullYear() === year);
  const cards = metrics.filter(m => m.type === 'flow').map(m => {
    const vals = rows.map(r => r.vals[m.id]).filter(v => v !== null && v !== undefined);
    const total = vals.reduce((a, b) => a + b, 0);
    const avg = vals.length ? total / vals.length : null;
    return `<div class="kpi-card year" style="min-height:auto">
      <div class="kpi-head"><span class="kpi-label">全年 ${m.label}</span></div>
      <div class="kpi-value ${p.id}" title="${fmtFull(total)}">${fmtNum(total)}</div>
      <div class="kpi-change flat">月平均 ${fmtNum(avg)}</div></div>`;
  }).join('');
  if (!cards) return '';
  return `<details class="year-block" open><summary>${year} 全年度累計（${rows[0].key} ~ ${rows[rows.length - 1].key}，共 ${rows.length} 個月）</summary>
    <div class="kpi-grid">${cards}</div></details>`;
}

// ---------- 全部平台：精簡總覽 ----------
const OVERVIEW_KEYS = {
  fb: { reach: 'fb_reach', reachLabel: '觸及人數', engage: 'fb_engage', engageLabel: '貼文互動' },
  ig: { reach: 'ig_reach', reachLabel: '觸及帳號', engage: 'ig_engage', engageLabel: '互動次數' },
  th: { reach: 'th_views', reachLabel: '瀏覽次數', engage: 'th_engage', engageLabel: '互動次數' },
  yt: { reach: 'yt_views', reachLabel: '觀看次數', engage: 'yt_minutes', engageLabel: '觀看分鐘', engageIsMinutes: true },
};
function ovDelta(m, cur, prev) {
  const c = compare(m, cur, prev);
  if (c.kind === 'none') return '<span class="ov-delta none">— 無前期</span>';
  const arrow = { up: '▲', down: '▼', flat: '■' }[c.kind];
  return `<span class="ov-delta ${c.kind}">${arrow} ${c.text}</span>`;
}
function Overview(ctx, jobs) {
  const sum = (id, range) => aggregate(periodRows(range, ctx.unit), METRIC[id]);
  const plats = PLATFORMS.filter(p => OVERVIEW_KEYS[p.id] && hasMetric(METRIC[OVERVIEW_KEYS[p.id].reach]));
  if (!plats.length) return '';
  const rows = plats.map(p => {
    const k = OVERVIEW_KEYS[p.id];
    return { p, k,
      reach: sum(k.reach, ctx.cur), reachPrev: sum(k.reach, ctx.prev),
      eng: hasMetric(METRIC[k.engage]) ? sum(k.engage, ctx.cur) : null,
      engPrev: hasMetric(METRIC[k.engage]) ? sum(k.engage, ctx.prev) : null };
  });
  // 總計：觸及＋觀看全部加總；互動只算 FB、IG、Threads（YouTube 的分鐘數不是互動）
  const tot = (key, filter) => {
    const v = rows.filter(filter).map(r => r[key]).filter(x => x !== null);
    return v.length ? v.reduce((a, b) => a + b, 0) : null;
  };
  const flowM = { type: 'flow' };
  const totReach = tot('reach', () => true), totReachPrev = tot('reachPrev', () => true);
  const isEng = r => !r.k.engageIsMinutes;
  const totEng = tot('eng', isEng), totEngPrev = tot('engPrev', isEng);
  const share = rows.map(r => ({ p: r.p, v: r.reach || 0 }));
  const shareTotal = share.reduce((a, b) => a + b.v, 0) || 1;

  const bar = share.map(x => `<div class="ov-seg ${x.p.id}" style="flex:${x.v}" title="${x.p.name} ${fmtFull(x.v)}"></div>`).join('');
  const legend = share.map(x => `<span class="ov-leg"><i class="${x.p.id}"></i>${x.p.name}<b>${(x.v / shareTotal * 100).toFixed(0)}%</b></span>`).join('');

  const cards = rows.map(r => {
    const sid = `ovspark-${r.p.id}`;
    jobs.push(() => drawSparkDark(sid, r.p, METRIC[r.k.reach], ctx));
    const engM = r.k.engageIsMinutes ? flowM : METRIC[r.k.engage] || flowM;
    return `<button class="ov-card ${r.p.id}" onclick="setPlatform('${r.p.id}')">
      <div class="ov-card-head"><span class="ov-chip ${r.p.id}">${r.p.name}</span><span class="ov-go">詳細 →</span></div>
      <div class="ov-metric">
        <div class="ov-label">${r.k.reachLabel}</div>
        <div class="ov-num" data-count="${r.reach ?? ''}" title="${fmtFull(r.reach)}">${fmtNum(r.reach)}</div>
        ${ovDelta(flowM, r.reach, r.reachPrev)}
      </div>
      <div class="ov-metric sub">
        <div class="ov-label">${r.k.engageLabel}</div>
        <div class="ov-num small" title="${fmtFull(r.eng)}">${fmtNum(r.eng)}</div>
        ${ovDelta(engM, r.eng, r.engPrev)}
      </div>
      <div class="ov-spark"><canvas id="${sid}"></canvas></div>
    </button>`;
  }).join('');

  return `<section class="overview">
    <div class="ov-hero">
      <div class="ov-hero-top">
        <span class="ov-kicker">ALL PLATFORMS · ${ctx.cur.label}</span>
        <span class="ov-kicker dim">vs ${ctx.prev.label}</span>
      </div>
      <div class="ov-totals">
        <div class="ov-total">
          <div class="ov-label">全平台觸及與觀看</div>
          <div class="ov-big" data-count="${totReach ?? ''}" title="${fmtFull(totReach)}">${fmtNum(totReach)}</div>
          ${ovDelta(flowM, totReach, totReachPrev)}
        </div>
        <div class="ov-total">
          <div class="ov-label">全平台互動</div>
          <div class="ov-big" data-count="${totEng ?? ''}" title="${fmtFull(totEng)}">${fmtNum(totEng)}</div>
          ${ovDelta(flowM, totEng, totEngPrev)}
        </div>
      </div>
      <div class="ov-share">
        <div class="ov-bar">${bar}</div>
        <div class="ov-legend">${legend}</div>
      </div>
      <div class="ov-note">觸及與觀看為各平台觸及人數、觸及帳號、瀏覽次數、影片觀看次數加總；互動為 FB、IG、Threads 加總（YouTube 以觀看分鐘呈現，不列入互動）。點下方平台卡片看完整數據。</div>
    </div>
    <div class="ov-grid">${cards}</div>
  </section>`;
}
function drawSparkDark(id, p, m, ctx) {

  if (s.filter(x => x.v !== null).length < 2) return;
  const el = document.getElementById(id); if (!el) return;
  const g = el.getContext('2d').createLinearGradient(0, 0, 0, 60);
  g.addColorStop(0, 'rgba(255,255,255,0.28)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  charts[id] = new Chart(el, {
    type: 'line',
    data: { labels: s.map(x => x.label), datasets: [{ data: s.map(x => x.v), borderColor: OV_LINE[p.id] || '#fff', backgroundColor: g, fill: true, borderWidth: 2, pointRadius: 0, tension: 0.4, spanGaps: true }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { label: c => fmtValFull(m, c.raw) } } },
      scales: { x: { display: false }, y: { display: false } } },
  });
}
const OV_LINE = { fb: '#5aa2ff', ig: '#ff5fa2', th: '#e8e8ee', yt: '#ff5a5f' };
// 數字跳動
function countUp() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.overview [data-count]').forEach(el => {
    const target = parseFloat(el.dataset.count); if (isNaN(target)) return;
    const t0 = performance.now(), dur = 900;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtNum(target * e);
      if (k < 1) requestAnimationFrame(step); else el.textContent = fmtNum(target);
    };
    requestAnimationFrame(step);
  });
}

// ---------- 主畫面 ----------
function render() {
  if (!DATA.monthly.length) return;
  lastMobile = isMobile();
  const ctx = resolvePeriod();
  syncControls();
  document.getElementById('period-caption').innerHTML =
    `本期 <b>${ctx.cur.label}</b>　對比上期 <b>${ctx.prev.label}</b>　｜流量類指標為期間加總，粉絲與追蹤者取期末值`;

  Object.values(charts).forEach(c => c.destroy());
  charts = {};
  const jobs = [];
  let html = '';

  if (state.platform === 'all') html += Overview(ctx, jobs);
  PLATFORMS.filter(p => state.platform === p.id).forEach(p => {
    const metrics = p.metrics.filter(hasMetric);
    if (!metrics.length) return;
    const kpis = metrics.map((m, i) => {
      const sid = `spark-${p.id}-${i}`;
      jobs.push(() => drawSpark(sid, p, m, ctx));
      return KpiCard(p, m, ctx, sid);
    }).join('');
    const trend = TrendChart(p, metrics, ctx);
    jobs.push(trend.draw);
    html += `<section class="platform-section">
      <div class="section-title ${p.id}">${p.name}</div>
      <div class="kpi-grid">${kpis}</div>
      <div class="charts-grid">${trend.html}</div>
      ${p.id === 'yt' ? VideoWall(ctx) : ''}
      ${YearSummary(p, metrics)}
      <div class="todo-note"><b>尚缺資料：</b>${p.todo}${p.noSnapshot || metrics.some(m => m.type === 'snapshot') ? '' : '；粉絲／追蹤者快照尚未寫入，有資料後會自動出現'}</div>
    </section>`;
  });
  html += TopPostsTable(ctx);

  document.getElementById('app').innerHTML = html || '<div class="empty">沒有可顯示的資料，請確認試算表欄位名稱</div>';
  jobs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  if (state.platform === 'all') countUp();
}
function drawSpark(id, p, m, ctx) {
  const s = sparkSeries(m, ctx);
  if (s.filter(x => x.v !== null).length < 2) return;
  charts[id] = new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels: s.map(x => x.label), datasets: [{ data: s.map(x => x.v), borderColor: p.color, borderWidth: 2.5, pointRadius: 0, tension: 0.35, fill: false, spanGaps: true }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: true, displayColors: false, callbacks: { label: c => fmtValFull(m, c.raw) } } },
      scales: { x: { display: false }, y: { display: false } },
    },
  });
}

loadData().catch(e => showError(`發生錯誤：${e.message}`));

</script>
